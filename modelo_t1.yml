#==============================================================================
#  Modelo do T1 - rede com 3 filas
#==============================================================================
#
#  Para usar o gerador do simulador (congruente linear), use 'rndnumbersPerSeed' e 'seeds'
#  (uma simulacao para cada semente, o resultado final e a media).
#  Para usar uma lista fixa de aleatorios, apague 'seeds' e use 'rndnumbers'.
#
#  Fila sem 'capacity' tem capacidade infinita.
#  Roteamento: o que faltar para fechar 100% nas rotas de uma fila vai para fora da rede.
#
#  NAO APAGAR A PROXIMA LINHA
!PARAMETERS
arrivals:
   Q1: 2.0

queues:
   Q1:
      servers: 1
      minArrival: 2.0
      maxArrival: 4.0
      minService: 1.0
      maxService: 2.0
   Q2:
      servers: 2
      capacity: 5
      minService: 4.0
      maxService: 6.0
   Q3:
      servers: 2
      capacity: 10
      minService: 5.0
      maxService: 15.0

network:
-  source: Q1
   target: Q2
   probability: 0.2
-  source: Q1
   target: Q3
   probability: 0.8
-  source: Q2
   target: Q1
   probability: 0.3
-  source: Q2
   target: Q3
   probability: 0.5
-  source: Q3
   target: Q2
   probability: 0.7

rndnumbersPerSeed: 100000
seeds:
- 7
